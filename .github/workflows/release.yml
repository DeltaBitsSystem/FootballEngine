name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: "10.0.x"

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - runtime: win-x64
            artifact: FootballEngine-win-x64
            archive: zip
          - runtime: linux-x64
            artifact: FootballEngine-linux-x64
            archive: tar.gz
          - runtime: osx-x64
            artifact: FootballEngine-osx-x64
            archive: tar.gz
          - runtime: osx-arm64
            artifact: FootballEngine-osx-arm64
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Publish
        run: |
          dotnet publish FootballEngine.Client/FootballEngine.Client.fsproj \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            --output ./publish/${{ matrix.artifact }} \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:VersionPrefix=${{ steps.version.outputs.VERSION }}

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        working-directory: ./publish
        run: zip -r ${{ matrix.artifact }}.zip ${{ matrix.artifact }}/

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        working-directory: ./publish
        run: tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/${{ matrix.artifact }}.*

  create-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "FootballEngine ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ./artifacts/FootballEngine-win-x64.zip
            ./artifacts/FootballEngine-linux-x64.tar.gz
            ./artifacts/FootballEngine-osx-x64.tar.gz
            ./artifacts/FootballEngine-osx-arm64.tar.gz
