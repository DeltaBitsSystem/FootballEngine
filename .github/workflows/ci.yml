name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Restore additional projects
        run: |
          dotnet restore FootballEngine.Client.Tests/FootballEngine.Client.Tests.fsproj
          dotnet restore Tools/ModCli/ModCli.fsproj

      - name: Restore .NET tools
        run: dotnet tool restore --tool-manifest dotnet-tools.json

      - name: Check formatting
        run: dotnet fantomas --check .

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Build additional projects
        run: |
          dotnet build FootballEngine.Client.Tests/FootballEngine.Client.Tests.fsproj --no-restore --configuration Release
          dotnet build Tools/ModCli/ModCli.fsproj --no-restore --configuration Release

      - name: Run all tests
        run: |
          dotnet run --project FootballEngine.Core.Tests/FootballEngine.Core.Tests.fsproj --configuration Release --no-build
          dotnet run --project FootballEngine.Client.Tests/FootballEngine.Client.Tests.fsproj --configuration Release --no-build
