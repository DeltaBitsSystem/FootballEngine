name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.fsproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Restore additional projects
        run: |
          dotnet restore Tools/ModCli/ModCli.fsproj

      - name: Restore .NET tools
        run: dotnet tool restore --tool-manifest dotnet-tools.json

      - name: Check formatting
        run: dotnet fantomas --check .

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Build additional projects
        run: |
          dotnet build Tools/ModCli/ModCli.fsproj --no-restore --configuration Release

      - name: Run all tests
        run: dotnet fsi scripts/test.fsx

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/tests/
          if-no-files-found: warn
